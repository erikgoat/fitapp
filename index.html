<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--card:#1a1a1a;--line:#333;--mut:#888;--fg:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:24px;margin:6px 0 12px}
h2{font-size:17px;margin:16px 0 6px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:100%;text-align:left}
button:active{background:#2a2a2a}
button.pri{background:var(--fg);color:#000;text-align:center;font-weight:600;border-color:var(--fg)}
button.sm{width:auto;padding:10px 14px}
button.mut{color:var(--mut);text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{flex:1}
.row>.sm{flex:none}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--mut);outline-offset:0}
.set{display:grid;grid-template-columns:36px 1fr 62px 62px 40px 40px;gap:6px;align-items:center;margin-bottom:5px}
.set .n{color:var(--mut);text-align:center}
.set .pv{background:none;border:0;padding:6px 0;color:var(--mut);font-size:14px;text-align:center;white-space:nowrap;width:100%}
.set input{text-align:center;padding:7px 2px;font-size:16px;border-radius:8px}
.set button{padding:6px 0;text-align:center;font-size:16px;border-radius:8px}
.set.done input{color:var(--mut);background:#000}
.set.done button[data-a="tick"]{background:#22c55e;color:#000;border-color:#22c55e}
.set.pr{border:2px solid #d4af37;border-radius:10px;padding:3px}
.set button[data-a="del"]{color:var(--mut)}
.set button[data-a="del"]:disabled{opacity:.25}
.lbl{display:grid;grid-template-columns:36px 1fr 62px 62px 40px 40px;gap:6px;color:var(--mut);font-size:13px;text-align:center;margin-bottom:4px}
.mutt{color:var(--mut)}
input::placeholder{color:#666;opacity:1}
.gap{height:12px}
button:disabled{opacity:.25}
#app>button:not(.sm){max-width:230px;padding:10px 12px;font-size:16px;display:block;margin-left:auto;margin-right:auto;text-align:center}
h1,#tm{text-align:center}
.hi{margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K='gym_v1',S=load(),view='home',ed=null,openH=null;
if(!S.hist)S.hist=[];
function ph(n,j,f){var l=S.last[n]||[],p=l[j];return p?p[f]:''}
function prevTxt(n,j){var w=ph(n,j,'w'),r=ph(n,j,'r');return (w||r)?esc(w||'–')+' × '+esc(r||'–'):''}
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.routines)return d}catch(e){}return{routines:[],last:{},draft:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
var app=document.getElementById('app');
var armed=null,lv='home';try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function ask(b,k,t){if(armed===k){armed=null;return true}armed=k;b.textContent=t||'Tap again to confirm';return false}

function fmt(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h+':'+(m<10?'0':'')+m+':'+(c<10?'0':'')+c}
function touch(){if(S.draft)S.draft.la=Date.now()}
function finishW(endT,auto){
  var rec={date:endT,name:S.draft.name,ex:[],dur:endT-(S.draft.t0||endT),auto:!!auto};
  S.draft.ex.forEach(function(x){
    var done=x.sets.filter(function(s){return s.d}).map(function(s){return{w:s.w,r:s.r,s:s.s||''}});
    if(done.length){S.last[x.name]=x.sets.map(function(s){return s.d?{w:s.w,r:s.r,s:s.s||''}:{w:'',r:'',s:s.s||''}});rec.ex.push({name:x.name,sets:done})}
  });
  if(rec.ex.length)addH(rec);
  S.draft=null;save();
}
function checkIdle(){
  var d=S.draft;if(!d||!d.la)return false;
  if(Date.now()-d.la>10800000){finishW(d.la,true);view='home';return true}
  return false;
}
setInterval(function(){
  if(!S.draft)return;
  if(checkIdle()){render();return}
  var e=document.getElementById('tm');if(e)e.textContent=fmt(Date.now()-S.draft.t0);
},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&checkIdle())render()});
function render(){
  if(view==='home')home();else if(view==='edit')edit();else if(view==='hist')hist();else if(view==='prs')prs();else if(view==='pick')pick();else if(view==='routines')routines();else if(view==='day')dayV();else work();
  if(view!==lv){window.scrollTo(0,0);lv=view}
}
function cal(){
  var done={};
  S.hist.forEach(function(r){var d=new Date(r.date);done[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()]=1});
  var now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate()),y=t.getFullYear(),m=t.getMonth();
  var lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((lead+days)/7),cnt=0;
  var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var h='<h2 style="text-align:center;margin:36px 0 8px;font-size:16px">'+t.toLocaleDateString('en-GB',{month:'long'})+'</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:270px;margin:0 auto">';
  names.forEach(function(n){h+='<div class="mutt" style="text-align:center;font-size:11px">'+n+'</div>'});
  for(var k=0;k<weeks*7;k++){
    var d=new Date(y,m,1-lead+k),out=d.getMonth()!==m;
    var key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(),on=done[key],fut=d>t,td=d.getTime()===t.getTime();
    if(on&&!out)cnt++;
    h+='<'+(on?'button data-a="day" data-k="'+key+'"':'div')+' style="padding:0;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:'+(on?'700':'400')+';color:'+(on?'#000':(out?'#444':'#fff'))+';border:'+(td?'2px solid #fff':(out?'1px solid #161616':'1px solid #444'))+';background:'+(on?'#22c55e':(out?'#000':'#2a2a2a'))+';opacity:'+(out?'.4':(fut?'.6':'1'))+'">'+d.getDate()+'</'+(on?'button':'div')+'>';
  }
  return h+'</div><p class="mutt" style="text-align:center;font-size:13px;margin:8px 0 0">'+cnt+' workout days</p>';
}
var dv=-1;
function addH(rec){addH(rec);S.hist.sort(function(a,b){return b.date-a.date})}
function dayV(){
  var r=S.hist[dv];
  if(!r){view='home';home();return}
  var d=new Date(r.date),n=S.hist.length;
  var h=BK+'<h1 style="margin-bottom:6px">'+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</h1>';
  h+='<div class="mutt" style="text-align:center;margin-bottom:10px">'+esc(r.name)+(r.dur?', '+Math.round(r.dur/60000)+' min':'')+'</div>';
  r.ex.forEach(function(x){
    h+='<div style="margin-top:10px;font-weight:600">'+esc(x.name)+'</div>';
    x.sets.forEach(function(t,j){h+='<div class="mutt">'+(t.s?(Math.floor(j/2)+1)+t.s:(j+1))+'.  '+esc(t.w||'\u2013')+' kg \u00d7 '+esc(t.r||'\u2013')+'</div>'});
  });
  h+='<div class="row" style="margin-top:22px"><button data-a="dprev" style="text-align:center;font-size:22px;padding:6px"'+(dv>=n-1?' disabled':'')+'>\u2039</button><span class="mutt" style="flex:none;min-width:60px;text-align:center">'+(n-dv)+' / '+n+'</span><button data-a="dnext" style="text-align:center;font-size:22px;padding:6px"'+(dv<=0?' disabled':'')+'>\u203a</button></div>';
  app.innerHTML=h;
}
function home(){
  var h='<div style="height:22vh"></div>';
  if(S.draft)h+='<button class="pri" data-a="resume">Workout in progress: '+esc(S.draft.name)+' <span id="tm">'+fmt(Date.now()-(S.draft.t0||Date.now()))+'</span></button><div class="gap"></div>';
  else h+='<button class="pri" data-a="pick" style="text-align:center">Start workout</button><div class="gap"></div>';
  h+='<button class="mut" data-a="routines">Routines</button><div class="gap"></div><button class="mut" data-a="hist">History</button><div class="gap"></div><button class="mut" data-a="prs">PR\'s</button>';
  h+=cal();
  app.innerHTML=h;
}
var BK='<button class="sm mut" data-a="home" style="padding:6px 14px;margin-bottom:6px;font-size:20px">\u2190</button>';
function pick(){
  var h=BK+'<h1>Choose workout</h1>';
  if(!S.routines.length)h+='<p class="mutt">No routines yet. Create one in Routines.</p>';
  S.routines.forEach(function(r,i){h+='<button data-a="start" data-i="'+i+'" style="margin-bottom:8px">'+esc(r.name)+'<div class="mutt" style="font-size:14px">'+r.ex.length+' exercises</div></button>'});
  app.innerHTML=h;
}
function routines(){
  var h=BK+'<h1>Routines</h1>';
  S.routines.forEach(function(r,i){h+='<button data-a="edit" data-i="'+i+'" style="margin-bottom:8px">'+esc(r.name)+'<div class="mutt" style="font-size:14px">'+r.ex.length+' exercises, tap to edit</div></button>'});
  h+='<div class="gap"></div><button class="mut" data-a="new">+ New routine</button>';
  app.innerHTML=h;
}
function hist(){
  var h='<h1>History</h1>';
  if(!S.hist.length)h+='<p class="mutt">Nothing yet. Finish your first workout.</p>';
  S.hist.forEach(function(r,i){
    var d=new Date(r.date);
    h+='<div class="hi"><button data-a="toggleH" data-i="'+i+'">'+esc(r.name)+'<div class="mutt" style="font-size:14px">'+d.toLocaleDateString('en-GB')+(r.dur?', '+Math.round(r.dur/60000)+' min':'')+(r.auto?', ended automatically, last action at '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'')+'</div></button>';
    if(openH===i){
      h+='<div style="padding:8px 4px 8px">';
      r.ex.forEach(function(x){
        h+='<div style="margin-top:10px"><b>'+esc(x.name)+'</b></div>';
        x.sets.forEach(function(s,j){h+='<div class="mutt">'+(s.s?(Math.floor(j/2)+1)+s.s:(j+1))+'.  '+esc(s.w)+' kg × '+esc(s.r)+'</div>'});
      });
      h+='<div class="gap"></div><button class="mut" data-a="delH" data-i="'+i+'">Delete entry</button></div>';
    }
    h+='</div>';
  });
  h+='<div class="gap"></div><button class="mut" data-a="home">Back</button>';
  app.innerHTML=h;
}
function prs(){
  var m={};
  S.hist.forEach(function(h){h.ex.forEach(function(x){x.sets.forEach(function(t){
    var w=parseFloat(String(t.w).replace(',','.')),r=parseFloat(t.r);if(isNaN(w)||isNaN(r))return;
    var e=m[x.name];if(!e)e=m[x.name]={w:null,v:null};
    var o={w:w,r:r,s:t.s||'',t:h.date,v:w*r};
    if(!e.w||w>e.w.w||(w===e.w.w&&r>e.w.r))e.w=o;
    if(!e.v||o.v>e.v.v)e.v=o;
  })})});
  var names=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'sk')});
  function f(o){return o.w+' kg × '+o.r+(o.s?' ('+o.s+')':'')}
  function d(o){return new Date(o.t).toLocaleDateString('en-GB')}
  var h='<h1>PR\'s</h1>';
  if(!names.length)h+='<p class="mutt">No records yet. Finish a workout with confirmed sets.</p>';
  names.forEach(function(n){
    var e=m[n];
    h+='<div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px"><div style="font-weight:600;margin-bottom:8px">'+esc(n)+'</div>';
    h+='<div>Weight: '+esc(f(e.w))+'</div><div class="mutt" style="font-size:14px;margin-bottom:8px">'+d(e.w)+'</div>';
    h+='<div>Volume: '+esc(f(e.v))+' = '+(Math.round(e.v.v*10)/10)+' kg</div><div class="mutt" style="font-size:14px">'+d(e.v)+'</div></div>';
  });
  h+='<div class="gap"></div><button class="mut" data-a="home">Back</button>';
  app.innerHTML=h;
}
function edit(){
  var h='<h1>'+(ed.id==null?'New routine':'Edit routine')+'</h1>';
  h+='<input data-f="rname" placeholder="Name (e.g. Push)" value="'+esc(ed.r.name)+'">';
  h+='<h2>Exercises</h2>';
  ed.r.ex.forEach(function(x,i){
    h+='<div class="row"><input data-f="ename" data-i="'+i+'" placeholder="Exercise" value="'+esc(x.name)+'"><button class="sm mut" data-a="delex" data-i="'+i+'">✕</button></div><div class="row"><input data-f="esets" data-i="'+i+'" inputmode="numeric" placeholder="Sets" value="'+esc(x.sets)+'" style="max-width:90px;text-align:center"><button data-a="uni" data-i="'+i+'" class="'+(x.uni?'pri':'')+'" style="text-align:center">'+(x.uni?'✓ Unilateral (L/R)':'Unilateral (L/R)')+'</button></div><div class="gap"></div>';
  });
  h+='<button class="mut" data-a="addex">+ Add exercise</button><div class="gap"></div>';
  h+='<button class="pri" data-a="saveR">Save</button><div class="gap"></div>';
  if(ed.id!=null)h+='<button class="mut" data-a="delR">Delete routine</button><div class="gap"></div>';
  h+='<button class="mut" data-a="routines">Cancel</button>';
  app.innerHTML=h;
}
function isPR(n,s){
  var w=parseFloat(String(s.w).replace(',','.')),r=parseFloat(s.r);
  if(!s.d||isNaN(w)||isNaN(r))return false;
  var bw=-1,br=-1,seen=false;
  S.hist.forEach(function(h){h.ex.forEach(function(x){if(x.name!==n)return;x.sets.forEach(function(t){
    if((t.s||'')!==(s.s||''))return;
    var tw=parseFloat(String(t.w).replace(',','.')),tr=parseFloat(t.r);if(isNaN(tw)||isNaN(tr))return;
    seen=true;if(tw>bw){bw=tw;br=tr}else if(tw===bw&&tr>br)br=tr;
  })})});
  if(!seen)return false;
  return w>bw||(w===bw&&r>br);
}
function work(){
  var d=S.draft,h='<button class="sm mut" data-a="home" style="padding:6px 14px;margin-bottom:6px;font-size:20px">←</button><h1>'+esc(d.name)+'</h1><div id="tm" style="font-size:22px;margin:-8px 0 4px;color:#888">'+fmt(Date.now()-(d.t0||Date.now()))+'</div>';
  d.ex.forEach(function(x,i){
    h+='<h2>'+esc(x.name)+'</h2><div class="lbl"><span></span><span>Previous</span><span>kg</span><span>reps</span><span></span><span></span></div>';
    x.sets.forEach(function(s,j){
      var pr=isPR(x.name,s);h+='<div class="set'+(s.d?' done':'')+(pr?' pr':'')+'"><span class="n">'+(x.uni?(Math.floor(j/2)+1)+(s.s||''):(j+1))+'</span><button class="pv" data-a="usep" data-i="'+i+'" data-j="'+j+'">'+prevTxt(x.name,j)+'</button><input inputmode="decimal" data-f="w" data-i="'+i+'" data-j="'+j+'" placeholder="'+esc(ph(x.name,j,'w'))+'" value="'+esc(s.w)+'"><input inputmode="numeric" data-f="r" data-i="'+i+'" data-j="'+j+'" placeholder="'+esc(ph(x.name,j,'r'))+'" value="'+esc(s.r)+'"><button data-a="tick" data-i="'+i+'" data-j="'+j+'">'+(pr?'🏆':'✓')+'</button><button data-a="del" data-i="'+i+'" data-j="'+j+'"'+(s.d||(x.uni&&(x.sets[j^1]||{}).d)?' disabled':'')+'>✕</button></div>';
    });
    h+='<div class="set"><span></span><button class="mut" data-a="addset" data-i="'+i+'" style="grid-column:2/5">+ set</button></div>';
  });
  h+='<div class="gap"></div><div class="gap"></div><button class="pri" data-a="finish">Finish workout</button><div class="gap"></div><button class="mut" data-a="cancel">Cancel workout</button>';
  app.innerHTML=h;
}

app.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute('data-f');if(!f)return;
  var i=+t.getAttribute('data-i'),j=+t.getAttribute('data-j');
  if(f==='rname')ed.r.name=t.value;
  else if(f==='ename')ed.r.ex[i].name=t.value;
  else if(f==='esets')ed.r.ex[i].sets=t.value;
  else if(f==='w'||f==='r'){S.draft.ex[i].sets[j][f]=t.value;S.draft.la=Date.now();save()}
});

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=b.getAttribute('data-a'),i=+b.getAttribute('data-i'),j=+b.getAttribute('data-j');
  if(armed&&armed.indexOf(a)!==0)armed=null;
  if(a==='home'){view='home'}
  else if(a==='new'){ed={id:null,r:{name:'',ex:[{name:'',sets:3}]}};view='edit'}
  else if(a==='edit'){ed={id:i,r:JSON.parse(JSON.stringify(S.routines[i]))};view='edit'}
  else if(a==='addex'){ed.r.ex.push({name:'',sets:3})}
  else if(a==='delex'){ed.r.ex.splice(i,1)}
  else if(a==='saveR'){
    ed.r.name=(ed.r.name||'').trim()||'Routine';
    ed.r.ex=ed.r.ex.filter(function(x){return (x.name||'').trim()}).map(function(x){return{name:x.name.trim(),sets:Math.max(1,parseInt(x.sets)||3),uni:!!x.uni}});
    if(ed.id==null)S.routines.push(ed.r);else S.routines[ed.id]=ed.r;
    save();view='routines';
  }
  else if(a==='delR'){if(!ask(b,'delR','Tap again: delete routine'))return;S.routines.splice(ed.id,1);save();view='routines'}
  else if(a==='start'){
    if(S.draft&&!ask(b,'start'+i,'Tap again: this discards the workout in progress'))return;
    var r=S.routines[i];
    S.draft={name:r.name,t0:Date.now(),la:Date.now(),ex:r.ex.map(function(x){
      var l=S.last[x.name]||[],sets=[];
      var n=x.sets*(x.uni?2:1);for(var k=0;k<n;k++){var p=l[k]||l[l.length-1]||{w:'',r:''};sets.push({w:'',r:'',d:false,s:x.uni?(k%2?'R':'L'):''})}
      return{name:x.name,uni:!!x.uni,sets:sets};
    })};
    save();view='work';
  }
  else if(a==='resume'){view='work'}
  else if(a==='usep'){var xu=S.draft.ex[i],su=xu.sets[j];touch();su.w=ph(xu.name,j,'w')||'';su.r=ph(xu.name,j,'r')||'';save()}
  else if(a==='del'){var xd=S.draft.ex[i];if(xd.sets[j].d||(xd.uni&&(xd.sets[j^1]||{}).d))return;touch();xd.sets.splice(xd.uni?j-(j%2):j,xd.uni?2:1);save()}
  else if(a==='uni'){ed.r.ex[i].uni=!ed.r.ex[i].uni}
  else if(a==='hist'){openH=null;view='hist'}
  else if(a==='prs'){view='prs'}
  else if(a==='pick'){view='pick'}
  else if(a==='routines'){view='routines'}
  else if(a==='day'){var kk=b.getAttribute('data-k');dv=-1;S.hist.forEach(function(r,n){var d=new Date(r.date);if(dv<0&&d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()===kk)dv=n});if(dv<0)return;view='day'}
  else if(a==='dprev'){if(dv<S.hist.length-1)dv++}
  else if(a==='dnext'){if(dv>0)dv--}
  else if(a==='toggleH'){openH=(openH===i?null:i)}
  else if(a==='delH'){if(!ask(b,'delH'+i,'Tap again: delete entry'))return;S.hist.splice(i,1);openH=null;save()}
  else if(a==='tick'){touch();var xe=S.draft.ex[i],s=xe.sets[j];s.d=!s.d;if(s.d){if(s.w==='')s.w=ph(xe.name,j,'w')||'';if(s.r==='')s.r=ph(xe.name,j,'r')||''}save()}
  else if(a==='addset'){touch();var xx=S.draft.ex[i],ss=xx.sets;if(xx.uni){ss.push({w:'',r:'',d:false,s:'L'});ss.push({w:'',r:'',d:false,s:'R'})}else ss.push({w:'',r:'',d:false,s:''});save()}
  else if(a==='finish'){var rec={date:Date.now(),name:S.draft.name,ex:[],dur:Date.now()-(S.draft.t0||Date.now())};
    S.draft.ex.forEach(function(x){
      var done=x.sets.filter(function(s){return s.d}).map(function(s){return{w:s.w,r:s.r,s:s.s||''}});
