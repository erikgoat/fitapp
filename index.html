<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tréningy</title>
<style>
:root{--bg:#000;--card:#1a1a1a;--line:#333;--mut:#888;--fg:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:19px;margin:22px 0 8px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;width:100%;text-align:left}
button:active{background:#2a2a2a}
button.pri{background:var(--fg);color:#000;text-align:center;font-weight:600;border-color:var(--fg)}
button.sm{width:auto;padding:10px 14px}
button.mut{color:var(--mut);text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{flex:1}
.row>.sm{flex:none}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--mut);outline-offset:0}
.set{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;align-items:center;margin-bottom:8px}
.set .n{color:var(--mut);text-align:center}
.set input{text-align:center}
.set button{padding:12px 0;text-align:center}
.set.done input{color:var(--mut);background:#000}
.set.done button{background:var(--fg);color:#000;border-color:var(--fg)}
.set.pr{border:2px solid #d4af37;border-radius:12px;padding:6px}
.lbl{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;color:var(--mut);font-size:13px;text-align:center;margin-bottom:4px}
.mutt{color:var(--mut)}
input::placeholder{color:#666;opacity:1}
.gap{height:12px}
.hi{margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K='gym_v1',S=load(),view='home',ed=null,openH=null;
if(!S.hist)S.hist=[];
function ph(n,j,f){var l=S.last[n]||[],p=l[j]||l[l.length-1];return p?p[f]:''}
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.routines)return d}catch(e){}return{routines:[],last:{},draft:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
var app=document.getElementById('app');
var armed=null,lv='home';try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function ask(b,k,t){if(armed===k){armed=null;return true}armed=k;b.textContent=t||'Ťukni znova pre potvrdenie';return false}

function render(){
  if(view==='home')home();else if(view==='edit')edit();else if(view==='hist')hist();else if(view==='prs')prs();else work();
  if(view!==lv){window.scrollTo(0,0);lv=view}
}
function home(){
  var h='<h1>Tréningy</h1>';
  if(S.draft)h+='<button class="pri" data-a="resume">Pokračovať: '+esc(S.draft.name)+'</button><div class="gap"></div>';
  if(!S.routines.length)h+='<p class="mutt">Zatiaľ nemáš žiadnu rutinu. Vytvor prvú.</p>';
  S.routines.forEach(function(r,i){
    h+='<div class="row"><button data-a="start" data-i="'+i+'">'+esc(r.name)+'<div class="mutt" style="font-size:14px">'+r.ex.length+' cvikov</div></button><button class="sm mut" data-a="edit" data-i="'+i+'">Upraviť</button></div>';
  });
  h+='<div class="gap"></div><button class="mut" data-a="new">+ Nová rutina</button><div class="gap"></div><button class="mut" data-a="hist">História</button><div class="gap"></div><button class="mut" data-a="prs">PR\'s</button>';
  app.innerHTML=h;
}
function hist(){
  var h='<h1>História</h1>';
  if(!S.hist.length)h+='<p class="mutt">Zatiaľ nič. Dokonči prvý tréning.</p>';
  S.hist.forEach(function(r,i){
    var d=new Date(r.date);
    h+='<div class="hi"><button data-a="toggleH" data-i="'+i+'">'+esc(r.name)+'<div class="mutt" style="font-size:14px">'+d.toLocaleDateString('sk-SK')+'</div></button>';
    if(openH===i){
      h+='<div style="padding:8px 4px 8px">';
      r.ex.forEach(function(x){
        h+='<div style="margin-top:10px"><b>'+esc(x.name)+'</b></div>';
        x.sets.forEach(function(s,j){h+='<div class="mutt">'+(s.s?(Math.floor(j/2)+1)+s.s:(j+1))+'.  '+esc(s.w)+' kg × '+esc(s.r)+'</div>'});
      });
      h+='<div class="gap"></div><button class="mut" data-a="delH" data-i="'+i+'">Zmazať záznam</button></div>';
    }
    h+='</div>';
  });
  h+='<div class="gap"></div><button class="mut" data-a="home">Späť</button>';
  app.innerHTML=h;
}
function prs(){
  var m={};
  S.hist.forEach(function(h){h.ex.forEach(function(x){x.sets.forEach(function(t){
    var w=parseFloat(String(t.w).replace(',','.')),r=parseFloat(t.r);if(isNaN(w)||isNaN(r))return;
    var e=m[x.name];if(!e)e=m[x.name]={w:null,v:null};
    var o={w:w,r:r,s:t.s||'',t:h.date,v:w*r};
    if(!e.w||w>e.w.w||(w===e.w.w&&r>e.w.r))e.w=o;
    if(!e.v||o.v>e.v.v)e.v=o;
  })})});
  var names=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'sk')});
  function f(o){return o.w+' kg × '+o.r+(o.s?' ('+o.s+')':'')}
  function d(o){return new Date(o.t).toLocaleDateString('sk-SK')}
  var h='<h1>PR\'s</h1>';
  if(!names.length)h+='<p class="mutt">Zatiaľ žiadne záznamy. Dokonči tréning s potvrdenými sériami.</p>';
  names.forEach(function(n){
    var e=m[n];
    h+='<div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px"><div style="font-weight:600;margin-bottom:8px">'+esc(n)+'</div>';
    h+='<div>Váha: '+esc(f(e.w))+'</div><div class="mutt" style="font-size:14px;margin-bottom:8px">'+d(e.w)+'</div>';
    h+='<div>Volume: '+esc(f(e.v))+' = '+(Math.round(e.v.v*10)/10)+' kg</div><div class="mutt" style="font-size:14px">'+d(e.v)+'</div></div>';
  });
  h+='<div class="gap"></div><button class="mut" data-a="home">Späť</button>';
  app.innerHTML=h;
}
function edit(){
  var h='<h1>'+(ed.id==null?'Nová rutina':'Upraviť rutinu')+'</h1>';
  h+='<input data-f="rname" placeholder="Názov (napr. Push)" value="'+esc(ed.r.name)+'">';
  h+='<h2>Cviky</h2>';
  ed.r.ex.forEach(function(x,i){
    h+='<div class="row"><input data-f="ename" data-i="'+i+'" placeholder="Cvik" value="'+esc(x.name)+'"><button class="sm mut" data-a="delex" data-i="'+i+'">✕</button></div><div class="row"><input data-f="esets" data-i="'+i+'" inputmode="numeric" placeholder="Sérií" value="'+esc(x.sets)+'" style="max-width:90px;text-align:center"><button data-a="uni" data-i="'+i+'" class="'+(x.uni?'pri':'')+'" style="text-align:center">'+(x.uni?'✓ Unilaterálny (L/P)':'Unilaterálny (L/P)')+'</button></div><div class="gap"></div>';
  });
  h+='<button class="mut" data-a="addex">+ Pridať cvik</button><div class="gap"></div>';
  h+='<button class="pri" data-a="saveR">Uložiť</button><div class="gap"></div>';
  if(ed.id!=null)h+='<button class="mut" data-a="delR">Zmazať rutinu</button><div class="gap"></div>';
  h+='<button class="mut" data-a="home">Zrušiť</button>';
  app.innerHTML=h;
}
function isPR(n,s){
  var w=parseFloat(String(s.w).replace(',','.')),r=parseFloat(s.r);
  if(!s.d||isNaN(w)||isNaN(r))return false;
  var bw=-1,br=-1,seen=false;
  S.hist.forEach(function(h){h.ex.forEach(function(x){if(x.name!==n)return;x.sets.forEach(function(t){
    if((t.s||'')!==(s.s||''))return;
    var tw=parseFloat(String(t.w).replace(',','.')),tr=parseFloat(t.r);if(isNaN(tw)||isNaN(tr))return;
    seen=true;if(tw>bw){bw=tw;br=tr}else if(tw===bw&&tr>br)br=tr;
  })})});
  if(!seen)return false;
  return w>bw||(w===bw&&r>br);
}
function work(){
  var d=S.draft,h='<h1>'+esc(d.name)+'</h1>';
  d.ex.forEach(function(x,i){
    h+='<h2>'+esc(x.name)+'</h2><div class="lbl"><span></span><span>kg</span><span>opak.</span><span></span></div>';
    x.sets.forEach(function(s,j){
      var pr=isPR(x.name,s);h+='<div class="set'+(s.d?' done':'')+(pr?' pr':'')+'"><span class="n">'+(x.uni?(Math.floor(j/2)+1)+(s.s||''):(j+1))+'</span><input inputmode="decimal" data-f="w" data-i="'+i+'" data-j="'+j+'" placeholder="'+esc(ph(x.name,j,'w'))+'" value="'+esc(s.w)+'"><input inputmode="numeric" data-f="r" data-i="'+i+'" data-j="'+j+'" placeholder="'+esc(ph(x.name,j,'r'))+'" value="'+esc(s.r)+'"><button data-a="tick" data-i="'+i+'" data-j="'+j+'">'+(pr?'🏆':'✓')+'</button></div>';
    });
    h+='<button class="mut" data-a="addset" data-i="'+i+'">+ séria</button>';
  });
  h+='<div class="gap"></div><div class="gap"></div><button class="pri" data-a="finish">Dokončiť tréning</button><div class="gap"></div><button class="mut" data-a="cancel">Zrušiť tréning</button>';
  app.innerHTML=h;
}

app.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute('data-f');if(!f)return;
  var i=+t.getAttribute('data-i'),j=+t.getAttribute('data-j');
  if(f==='rname')ed.r.name=t.value;
  else if(f==='ename')ed.r.ex[i].name=t.value;
  else if(f==='esets')ed.r.ex[i].sets=t.value;
  else if(f==='w'||f==='r'){S.draft.ex[i].sets[j][f]=t.value;save()}
});

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=b.getAttribute('data-a'),i=+b.getAttribute('data-i'),j=+b.getAttribute('data-j');
  if(armed&&armed.indexOf(a)!==0)armed=null;
  if(a==='home'){view='home'}
  else if(a==='new'){ed={id:null,r:{name:'',ex:[{name:'',sets:3}]}};view='edit'}
  else if(a==='edit'){ed={id:i,r:JSON.parse(JSON.stringify(S.routines[i]))};view='edit'}
  else if(a==='addex'){ed.r.ex.push({name:'',sets:3})}
  else if(a==='delex'){ed.r.ex.splice(i,1)}
  else if(a==='saveR'){
    ed.r.name=(ed.r.name||'').trim()||'Rutina';
    ed.r.ex=ed.r.ex.filter(function(x){return (x.name||'').trim()}).map(function(x){return{name:x.name.trim(),sets:Math.max(1,parseInt(x.sets)||3),uni:!!x.uni}});
    if(ed.id==null)S.routines.push(ed.r);else S.routines[ed.id]=ed.r;
    save();view='home';
  }
  else if(a==='delR'){if(!ask(b,'delR','Ťukni znova: zmazať rutinu'))return;S.routines.splice(ed.id,1);save();view='home'}
  else if(a==='start'){
    if(S.draft&&!ask(b,'start'+i,'Ťukni znova: zahodí rozpracovaný tréning'))return;
    var r=S.routines[i];
    S.draft={name:r.name,ex:r.ex.map(function(x){
      var l=S.last[x.name]||[],sets=[];
      var n=x.sets*(x.uni?2:1);for(var k=0;k<n;k++){var p=l[k]||l[l.length-1]||{w:'',r:''};sets.push({w:'',r:'',d:false,s:x.uni?(k%2?'P':'L'):''})}
      return{name:x.name,uni:!!x.uni,sets:sets};
    })};
    save();view='work';
  }
  else if(a==='resume'){view='work'}
  else if(a==='uni'){ed.r.ex[i].uni=!ed.r.ex[i].uni}
  else if(a==='hist'){openH=null;view='hist'}
  else if(a==='prs'){view='prs'}
  else if(a==='toggleH'){openH=(openH===i?null:i)}
  else if(a==='delH'){if(!ask(b,'delH'+i,'Ťukni znova: zmazať záznam'))return;S.hist.splice(i,1);openH=null;save()}
  else if(a==='tick'){var xe=S.draft.ex[i],s=xe.sets[j];s.d=!s.d;if(s.d){if(s.w==='')s.w=ph(xe.name,j,'w')||'';if(s.r==='')s.r=ph(xe.name,j,'r')||''}save()}
  else if(a==='addset'){var xx=S.draft.ex[i],ss=xx.sets;if(xx.uni){ss.push({w:'',r:'',d:false,s:'L'});ss.push({w:'',r:'',d:false,s:'P'})}else ss.push({w:'',r:'',d:false,s:''});save()}
  else if(a==='finish'){var rec={date:Date.now(),name:S.draft.name,ex:[]};
    S.draft.ex.forEach(function(x){
      var done=x.sets.filter(function(s){return s.d}).map(function(s){return{w:s.w,r:s.r,s:s.s||''}});
      if(done.length){S.last[x.name]=done;rec.ex.push({name:x.name,sets:done})}
    });
    if(!rec.ex.length&&!ask(b,'finish','Žiadna séria nie je potvrdená ✓. Ťukni znova pre ukončenie bez záznamu'))return;
    if(rec.ex.length)S.hist.unshift(rec);S.draft=null;save();view='home';
  }
  else if(a==='cancel'){if(!ask(b,'cancel','Ťukni znova: zahodiť tréning'))return;S.draft=null;save();view='home'}
  else return;
  render();
});
render();
</script>
</body>
</html>
