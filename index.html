<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
/* ===== Base ===== */
:root {
  --bg: #000; --card: #1a1a1a; --line: #333; --dim: #888; --fg: #fff;
  --ok: #22c55e; --gold: #d4af37;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 520px; margin: 0 auto; padding: 16px 14px 90px; }
h1 { font-size: 24px; margin: 6px 0 12px; text-align: center; }
h2 { font-size: 17px; margin: 16px 0 6px; }
.dim { color: var(--dim); }
.note { font-size: 14px; }
.gap { height: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }

/* ===== Buttons & inputs ===== */
button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; text-align: left; }
button:active { background: #2a2a2a; }
button:disabled { opacity: .25; }
button.primary { background: var(--fg); color: #000; border-color: var(--fg); font-weight: 600; text-align: center; }
button.ghost { color: var(--dim); text-align: center; }
button.center { text-align: center; }
button.small { width: auto; padding: 10px 14px; }
button.back { padding: 6px 14px; margin-bottom: 6px; font-size: 20px; }
button.arrow { padding: 6px; font-size: 22px; text-align: center; }
input { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; min-width: 0; }
input:focus { outline: 2px solid var(--dim); outline-offset: 0; }
input::placeholder { color: #666; opacity: 1; }

/* Menu-style buttons: direct children of #app, narrow and centered */
#app > button:not(.small) { display: block; max-width: 230px; margin: 0 auto; padding: 10px 12px; font-size: 16px; text-align: center; }
#app > button.item { margin-bottom: 8px; }
#app > button.hero { max-width: 260px; padding: 14px; font-size: 18px; font-weight: 600; }

/* Home screen: fixed to the viewport, no scrolling */
html.locked, body.locked { overflow: hidden; height: 100%; overscroll-behavior: none; }
body.locked #app { height: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
body.locked #app > * { flex: none; }
body.locked #app > .spacer { flex: 1 1 0; max-height: 22vh; min-height: 0; }

/* ===== Layout helpers ===== */
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.row > * { flex: 1; }
.row > .small { flex: none; }
.row > input.sets { max-width: 90px; text-align: center; }
.pager { margin-top: 22px; }
.pager .count { flex: none; min-width: 60px; text-align: center; }
.timer { font-size: 22px; margin: -8px 0 4px; color: var(--dim); text-align: center; }

/* ===== Workout sets ===== */
.set, .labels { display: grid; grid-template-columns: 36px 1fr 62px 62px 40px 40px; gap: 6px; }
.set { align-items: center; margin-bottom: 5px; }
.labels { color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 4px; }
.set .num { color: var(--dim); text-align: center; }
.set input { text-align: center; padding: 7px 2px; font-size: 16px; border-radius: 8px; }
.set button { padding: 6px 0; text-align: center; font-size: 16px; border-radius: 8px; }
.set .prev { background: none; border: 0; padding: 6px 0; color: var(--dim); font-size: 14px; white-space: nowrap; }
.set .del { color: var(--dim); }
.set .add { grid-column: 2 / 5; }
.set.done input { color: var(--dim); background: #000; }
.set.done .tick { background: var(--ok); color: #000; border-color: var(--ok); }
.set.pr { border: 2px solid var(--gold); border-radius: 10px; padding: 3px; }

/* ===== Calendar ===== */
.cal-title { text-align: center; margin: 36px 0 8px; font-size: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; max-width: 270px; margin: 0 auto; }
.cal-head { text-align: center; font-size: 11px; color: var(--dim); }
.cal-day { height: 30px; padding: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 400; color: var(--fg); background: #2a2a2a; border: 1px solid #444; }
.cal-day.miss { color: #d9a3a3; background: #2e1a1a; border-color: #4a2a2a; }
.cal-day.on { color: #000; background: var(--ok); font-weight: 700; }
.cal-day.future { opacity: .6; }
.cal-day.out { opacity: .4; border-color: #161616; }
.cal-day.out:not(.on) { color: #444; background: #000; }
.cal-day.today { border: 2px solid var(--fg); }
.cal-foot { text-align: center; font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ===== Constants & state ===== */
const KEY = 'gym_v1';
const IDLE_MS = 3 * 60 * 60 * 1000;           // auto-finish after 3 h without action
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const BACK = '<button class="small ghost back" data-a="home">←</button>';
const $app = document.getElementById('app');

/* db = { routines, last, hist, draft }
   routine : { name, ex: [{ name, sets, uni }] }
   draft   : { name, t0, la, ex: [{ name, uni, sets: [{ w, r, d, s }] }] }   (t0 start, la last action)
   last    : { exerciseName: [{ w, r, s }] }   values from the previous workout, by set position
   hist    : [{ date, name, dur, auto, ex: [{ name, sets: [{ w, r, s }] }] }]   newest first */
const db = load();
let view = 'home', editing = null, openEntry = null, dayIdx = -1, armed = null, shownView = 'home';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.routines) return Object.assign({ last: {}, hist: [], draft: null }, d);
  } catch (e) { /* storage unavailable or corrupted */ }
  return { routines: [], last: {}, hist: [], draft: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* ignore */ } }

/* ===== Helpers ===== */
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const num = v => parseFloat(String(v).replace(',', '.'));
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const pad = n => String(n).padStart(2, '0');
const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const minutes = r => (r.dur ? `, ${Math.round(r.dur / 60000)} min` : '');
const setLabel = (s, j) => (s.s ? `${Math.floor(j / 2) + 1}${s.s}` : j + 1);
const setText = s => `${esc(s.w || '–')} kg × ${esc(s.r || '–')}`;
const newSet = side => ({ w: '', r: '', d: false, s: side });
const sortHist = () => db.hist.sort((a, b) => b.date - a.date);
const touch = () => { if (db.draft) db.draft.la = Date.now(); };

/* Value from the previous workout at the same set position */
const ph = (name, j, f) => { const p = (db.last[name] || [])[j]; return p ? p[f] : ''; };
const prevText = (name, j) => {
  const w = ph(name, j, 'w'), r = ph(name, j, 'r');
  return w || r ? `${esc(w || '–')} × ${esc(r || '–')}` : '';
};

/* Two-tap confirmation (confirm() dialogs do not work in this environment) */
function ask(btn, key, text) {
  if (armed === key) { armed = null; return true; }
  armed = key;
  btn.textContent = text || 'Tap again to confirm';
  return false;
}

/* ===== Workout logic ===== */
const hasDoneSets = () => db.draft.ex.some(x => x.sets.some(s => s.d));

/* Heavier weight, or the same weight with more reps, than anything in history (same exercise and side) */
function isPR(name, set) {
  const w = num(set.w), r = num(set.r);
  if (!set.d || isNaN(w) || isNaN(r)) return false;
  let seen = false, bestW = -1, bestR = -1;
  db.hist.forEach(h => h.ex.filter(x => x.name === name).forEach(x => x.sets.forEach(t => {
    if ((t.s || '') !== (set.s || '')) return;
    const tw = num(t.w), tr = num(t.r);
    if (isNaN(tw) || isNaN(tr)) return;
    seen = true;
    if (tw > bestW) { bestW = tw; bestR = tr; } else if (tw === bestW && tr > bestR) bestR = tr;
  })));
  return seen && (w > bestW || (w === bestW && r > bestR));
}

/* Saves confirmed sets to history and remembers every set position for "Previous" */
function finishWorkout(endTime, auto) {
  const d = db.draft;
  const rec = { date: endTime, name: d.name, ex: [], dur: endTime - (d.t0 || endTime), auto };
  d.ex.forEach(x => {
    const done = x.sets.filter(s => s.d).map(s => ({ w: s.w, r: s.r, s: s.s || '' }));
    if (!done.length) return;
    db.last[x.name] = x.sets.map(s => (s.d ? { w: s.w, r: s.r, s: s.s || '' } : { w: '', r: '', s: s.s || '' }));
    rec.ex.push({ name: x.name, sets: done });
  });
  if (rec.ex.length) { db.hist.unshift(rec); sortHist(); }
  db.draft = null;
  save();
}

function checkIdle() {
  const d = db.draft;
  if (!d || !d.la || Date.now() - d.la <= IDLE_MS) return false;
  finishWorkout(d.la, true);                  // recorded at the time of the last action
  view = 'home';
  return true;
}

/* Personal records per exercise: heaviest set and highest volume set */
function records() {
  const m = {};
  db.hist.forEach(h => h.ex.forEach(x => x.sets.forEach(t => {
    const w = num(t.w), r = num(t.r);
    if (isNaN(w) || isNaN(r)) return;
    const e = m[x.name] || (m[x.name] = { weight: null, volume: null });
    const o = { w, r, s: t.s || '', date: h.date, v: w * r };
    if (!e.weight || w > e.weight.w || (w === e.weight.w && r > e.weight.r)) e.weight = o;
    if (!e.volume || o.v > e.volume.v) e.volume = o;
  })));
  return m;
}

/* ===== Views (each returns HTML) ===== */
const views = {
  home() {
    const d = db.draft;
    return `
      <div class="spacer"></div>
      ${d
        ? `<button class="primary hero" data-a="resume">Workout in progress: ${esc(d.name)} <span id="tm">${clock(Date.now() - d.t0)}</span></button>`
        : '<button class="primary hero" data-a="pick">Start workout</button>'}
      <div class="gap"></div>
      <button class="ghost" data-a="routines">Routines</button><div class="gap"></div>
      <button class="ghost" data-a="hist">History</button><div class="gap"></div>
      <button class="ghost" data-a="prs">PR’s</button>
      ${calendar()}`;
  },

  pick() {
    const items = db.routines.map((r, i) =>
      `<button class="item" data-a="start" data-i="${i}">${esc(r.name)}<div class="dim note">${r.ex.length} exercises</div></button>`).join('');
    return `${BACK}<h1>Choose workout</h1>${db.routines.length ? items : '<p class="dim">No routines yet. Create one in Routines.</p>'}`;
  },

  routines() {
    const items = db.routines.map((r, i) =>
      `<button class="item" data-a="edit" data-i="${i}">${esc(r.name)}<div class="dim note">${r.ex.length} exercises, tap to edit</div></button>`).join('');
    return `${BACK}<h1>Routines</h1>${items}<div class="gap"></div><button class="ghost" data-a="new">+ New routine</button>`;
  },

  edit() {
    const r = editing.r;
    const exercise = (x, i) => `
      <div class="row">
        <input data-f="ename" data-i="${i}" placeholder="Exercise" value="${esc(x.name)}">
        <button class="small ghost" data-a="delex" data-i="${i}">✕</button>
      </div>
      <div class="row">
        <input class="sets" data-f="esets" data-i="${i}" inputmode="numeric" placeholder="Sets" value="${esc(x.sets)}">
        <button class="center ${x.uni ? 'primary' : ''}" data-a="uni" data-i="${i}">${x.uni ? '✓ ' : ''}Unilateral (L/R)</button>
      </div>
      <div class="gap"></div>`;
    return `
      <h1>${editing.id == null ? 'New routine' : 'Edit routine'}</h1>
      <input data-f="rname" placeholder="Name (e.g. Push)" value="${esc(r.name)}">
      <h2>Exercises</h2>
      ${r.ex.map(exercise).join('')}
      <button class="ghost" data-a="addex">+ Add exercise</button><div class="gap"></div>
      <button class="primary" data-a="saveR">Save</button><div class="gap"></div>
      ${editing.id != null ? '<button class="ghost" data-a="delR">Delete routine</button><div class="gap"></div>' : ''}
      <button class="ghost" data-a="routines">Cancel</button>`;
  },

  work() {
    const d = db.draft;
    const setRow = (x, i, s, j) => {
      const pr = isPR(x.name, s);
      const locked = s.d || (x.uni && (x.sets[j ^ 1] || {}).d);   // a unilateral pair is deleted together
      const at = `data-i="${i}" data-j="${j}"`;
      return `
        <div class="set${s.d ? ' done' : ''}${pr ? ' pr' : ''}">
          <span class="num">${setLabel(s, j)}</span>
          <button class="prev" data-a="usep" ${at}>${prevText(x.name, j)}</button>
          <input inputmode="decimal" data-f="w" ${at} placeholder="${esc(ph(x.name, j, 'w'))}" value="${esc(s.w)}">
          <input inputmode="numeric" data-f="r" ${at} placeholder="${esc(ph(x.name, j, 'r'))}" value="${esc(s.r)}">
          <button class="tick" data-a="tick" ${at}>${pr ? '🏆' : '✓'}</button>
          <button class="del" data-a="del" ${at}${locked ? ' disabled' : ''}>✕</button>
        </div>`;
    };
    const exercise = (x, i) => `
      <h2>${esc(x.name)}</h2>
      <div class="labels"><span></span><span>Previous</span><span>kg</span><span>reps</span><span></span><span></span></div>
      ${x.sets.map((s, j) => setRow(x, i, s, j)).join('')}
      <div class="set"><span></span><button class="ghost add" data-a="addset" data-i="${i}">+ set</button></div>`;
    return `
      ${BACK}<h1>${esc(d.name)}</h1>
      <div class="timer" id="tm">${clock(Date.now() - d.t0)}</div>
      ${d.ex.map(exercise).join('')}
      <div class="gap"></div><div class="gap"></div>
      <button class="primary" data-a="finish">Finish workout</button><div class="gap"></div>
      <button class="ghost" data-a="cancel">Cancel workout</button>`;
  },

  hist() {
    const entry = (r, i) => {
      const d = new Date(r.date);
      const auto = r.auto ? `, ended automatically, last action at ${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}` : '';
      const detail = openEntry !== i ? '' : `
        <div style="padding: 8px 4px">
          ${r.ex.map(x => `<div style="margin-top: 10px"><b>${esc(x.name)}</b></div>${x.sets.map((s, j) => `<div class="dim">${setLabel(s, j)}.  ${setText(s)}</div>`).join('')}`).join('')}
          <div class="gap"></div><button class="ghost" data-a="delH" data-i="${i}">Delete entry</button>
        </div>`;
      return `<div style="margin-bottom: 8px">
        <button data-a="toggleH" data-i="${i}">${esc(r.name)}<div class="dim note">${d.toLocaleDateString('en-GB')}${minutes(r)}${auto}</div></button>${detail}</div>`;
    };
    return `<h1>History</h1>
      ${db.hist.length ? db.hist.map(entry).join('') : '<p class="dim">Nothing yet. Finish your first workout.</p>'}
      <div class="gap"></div><button class="ghost" data-a="home">Back</button>`;
  },

  prs() {
    const m = records();
    const fmt = o => `${o.w} kg × ${o.r}${o.s ? ` (${o.s})` : ''}`;
    const when = o => new Date(o.date).toLocaleDateString('en-GB');
    const names = Object.keys(m).sort((a, b) => a.localeCompare(b, 'sk'));
    const cards = names.map(n => `
      <div class="card">
        <div style="font-weight: 600; margin-bottom: 8px">${esc(n)}</div>
        <div>Weight: ${esc(fmt(m[n].weight))}</div><div class="dim note" style="margin-bottom: 8px">${when(m[n].weight)}</div>
        <div>Volume: ${esc(fmt(m[n].volume))} = ${Math.round(m[n].volume.v * 10) / 10} kg</div><div class="dim note">${when(m[n].volume)}</div>
      </div>`).join('');
    return `<h1>PR’s</h1>
      ${names.length ? cards : '<p class="dim">No records yet. Finish a workout with confirmed sets.</p>'}
      <div class="gap"></div><button class="ghost" data-a="home">Back</button>`;
  },

  day() {
    const r = db.hist[dayIdx], n = db.hist.length;
    const date = new Date(r.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const exercises = r.ex.map(x => `
      <div style="margin-top: 10px; font-weight: 600">${esc(x.name)}</div>
      ${x.sets.map((s, j) => `<div class="dim">${setLabel(s, j)}.  ${setText(s)}</div>`).join('')}`).join('');
    return `${BACK}<h1 style="margin-bottom: 6px">${date}</h1>
      <div class="dim" style="text-align: center; margin-bottom: 10px">${esc(r.name)}${minutes(r)}</div>
      ${exercises}
      <div class="row pager">
        <button class="arrow" data-a="dprev"${dayIdx >= n - 1 ? ' disabled' : ''}>‹</button>
        <span class="dim count">${n - dayIdx} / ${n}</span>
        <button class="arrow" data-a="dnext"${dayIdx <= 0 ? ' disabled' : ''}>›</button>
      </div>`;
  }
};

/* Month calendar: Monday-first weeks, finished-workout days are green and tappable */
function calendar() {
  const worked = new Set(db.hist.map(r => dayKey(new Date(r.date))));
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const y = today.getFullYear(), m = today.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const weeks = Math.ceil((lead + new Date(y, m + 1, 0).getDate()) / 7);
  let count = 0, cells = DAYS.map(n => `<div class="cal-head">${n}</div>`).join('');
  for (let k = 0; k < weeks * 7; k++) {
    const d = new Date(y, m, 1 - lead + k), key = dayKey(d);
    const out = d.getMonth() !== m, on = worked.has(key);
    if (on && !out) count++;
    const cls = ['cal-day', on && 'on', out && 'out', !on && !out && d < today && 'miss', d > today && 'future', +d === +today && 'today']
      .filter(Boolean).join(' ');
    cells += on
      ? `<button class="${cls}" data-a="day" data-k="${key}">${d.getDate()}</button>`
      : `<div class="${cls}">${d.getDate()}</div>`;
  }
  return `<h2 class="cal-title">${today.toLocaleDateString('en-GB', { month: 'long' })}</h2>
    <div class="cal">${cells}</div><p class="dim cal-foot">${count} workout days</p>`;
}

function render() {
  if (view === 'day' && !db.hist[dayIdx]) view = 'home';
  const locked = view === 'home';
  document.documentElement.classList.toggle('locked', locked);
  document.body.classList.toggle('locked', locked);
  $app.innerHTML = views[view]();
  if (view !== shownView) { window.scrollTo(0, 0); shownView = view; }
}

/* ===== Actions (data-a on buttons). Returning false skips the re-render ===== */
const actions = {
  // navigation
  home: () => { view = 'home'; },
  pick: () => { view = 'pick'; },
  routines: () => { view = 'routines'; },
  hist: () => { openEntry = null; view = 'hist'; },
  prs: () => { view = 'prs'; },
  resume: () => { view = 'work'; },
  day: (i, j, b) => {
    dayIdx = db.hist.findIndex(r => dayKey(new Date(r.date)) === b.dataset.k);   // newest workout of that day
    if (dayIdx < 0) return false;
    view = 'day';
  },
  dprev: () => { if (dayIdx < db.hist.length - 1) dayIdx++; },
  dnext: () => { if (dayIdx > 0) dayIdx--; },

  // routine editor
  new: () => { editing = { id: null, r: { name: '', ex: [{ name: '', sets: 3 }] } }; view = 'edit'; },
  edit: i => { editing = { id: i, r: JSON.parse(JSON.stringify(db.routines[i])) }; view = 'edit'; },
  addex: () => { editing.r.ex.push({ name: '', sets: 3 }); },
  delex: i => { editing.r.ex.splice(i, 1); },
  uni: i => { const x = editing.r.ex[i]; x.uni = !x.uni; },
  saveR: () => {
    const r = editing.r;
    r.name = (r.name || '').trim() || 'Routine';
    r.ex = r.ex.filter(x => (x.name || '').trim())
      .map(x => ({ name: x.name.trim(), sets: Math.max(1, parseInt(x.sets) || 3), uni: !!x.uni }));
    if (editing.id == null) db.routines.push(r); else db.routines[editing.id] = r;
    save(); view = 'routines';
  },
  delR: (i, j, b) => {
    if (!ask(b, 'delR', 'Tap again: delete routine')) return false;
    db.routines.splice(editing.id, 1);
    save(); view = 'routines';
  },

  // workout
  start: (i, j, b) => {
    if (db.draft && !ask(b, 'start' + i, 'Tap again: this discards the workout in progress')) return false;
    const r = db.routines[i], now = Date.now();
    db.draft = {
      name: r.name, t0: now, la: now,
      ex: r.ex.map(x => ({
        name: x.name, uni: !!x.uni,
        sets: Array.from({ length: x.sets * (x.uni ? 2 : 1) }, (_, k) => newSet(x.uni ? (k % 2 ? 'R' : 'L') : ''))
      }))
    };
    save(); view = 'work';
  },
  tick: (i, j) => {
    touch();
    const x = db.draft.ex[i], s = x.sets[j];
    s.d = !s.d;
    if (s.d) {                                 // empty fields take the previous values
      if (s.w === '') s.w = ph(x.name, j, 'w');
      if (s.r === '') s.r = ph(x.name, j, 'r');
    }
    save();
  },
  usep: (i, j) => {                            // tap "Previous" to copy it into the fields
    touch();
    const x = db.draft.ex[i], s = x.sets[j];
    s.w = ph(x.name, j, 'w'); s.r = ph(x.name, j, 'r');
    save();
  },
  del: (i, j) => {
    const x = db.draft.ex[i];
    if (x.sets[j].d || (x.uni && (x.sets[j ^ 1] || {}).d)) return false;
    touch();
    x.sets.splice(x.uni ? j - (j % 2) : j, x.uni ? 2 : 1);
    save();
  },
  addset: i => {
    touch();
    const x = db.draft.ex[i];
    if (x.uni) x.sets.push(newSet('L'), newSet('R')); else x.sets.push(newSet(''));
    save();
  },
  finish: (i, j, b) => {
    if (!hasDoneSets() && !ask(b, 'finish', 'No set confirmed with ✓. Tap again to finish without saving')) return false;
    finishWorkout(Date.now(), false);
    view = 'home';
  },
  cancel: (i, j, b) => {
    if (!ask(b, 'cancel', 'Tap again: discard workout')) return false;
    db.draft = null; save(); view = 'home';
  },

  // history
  toggleH: i => { openEntry = openEntry === i ? null : i; },
  delH: (i, j, b) => {
    if (!ask(b, 'delH' + i, 'Tap again: delete entry')) return false;
    db.hist.splice(i, 1); openEntry = null; save();
  }
};

$app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || !actions[b.dataset.a]) return;
  const a = b.dataset.a;
  if (armed && !armed.startsWith(a)) armed = null;
  if (actions[a](+b.dataset.i, +b.dataset.j, b) !== false) render();
});

$app.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f;
  if (!f) return;
  const i = +t.dataset.i, j = +t.dataset.j;
  if (f === 'rname') editing.r.name = t.value;
  else if (f === 'ename') editing.r.ex[i].name = t.value;
  else if (f === 'esets') editing.r.ex[i].sets = t.value;
  else { db.draft.ex[i].sets[j][f] = t.value; touch(); save(); }     // f is 'w' or 'r'
});

/* ===== Timer & idle check ===== */
setInterval(() => {
  if (!db.draft) return;
  if (checkIdle()) { render(); return; }
  const t = document.getElementById('tm');
  if (t) t.textContent = clock(Date.now() - db.draft.t0);
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && checkIdle()) render(); });

/* ===== Start-up ===== */
(function migrate() {                          // older versions used "P" (pravá) for the right side
  const fix = sets => (sets || []).forEach(t => { if (t.s === 'P') t.s = 'R'; });
  db.hist.forEach(h => h.ex.forEach(x => fix(x.sets)));
  Object.keys(db.last).forEach(k => fix(db.last[k]));
  if (db.draft) db.draft.ex.forEach(x => fix(x.sets));
  if (db.draft && !db.draft.t0) db.draft.t0 = db.draft.la = Date.now();
  sortHist();
})();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
checkIdle();
if (db.draft) view = 'work';
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
